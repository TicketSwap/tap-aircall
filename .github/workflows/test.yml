name: Test tap-aircall

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - tap_aircall/**
      - tests/**
      - pyproject.toml
      - poetry.lock
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run ruff
        run: |
          uvx ruff@0.17.3 check
          uvx ruff@0.17.3 format --check

  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2
        id: baipp

  pytest:
    needs: [build-package]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install
      - name: Run pytest
        env:
          TAP_AIRCALL_API_KEY: ${{ secrets.TAP_AIRCALL_API_KEY }}
          TAP_AIRCALL_API_TOKEN: ${{ secrets.TAP_AIRCALL_API_TOKEN }}
        run: poetry run pytest

  test:
    if: always()
    needs: [pytest]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any pytest leg failed
        if: needs.pytest.result != 'success'
        run: exit 1

  typing:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run mypy
        run: |
          pip install pre-commit
          pre-commit run mypy --all-files
