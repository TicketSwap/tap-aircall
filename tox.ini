# This file can be used to customize tox tests as well as other test frameworks like flake8 and mypy

[tox]
envlist = py311
isolated_build = true

[testenv]
allowlist_externals = poetry
pass_env =
    CI
    GITHUB_*
    TAP_AIRCALL_*
commands =
    poetry install -v
    poetry run pytest

[testenv:pytest]
# Run the python tests.
# To execute, run `tox -e pytest`
envlist = py311
commands =
    poetry install -v
    poetry run pytest
